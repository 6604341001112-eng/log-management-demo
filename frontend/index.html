<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Log Management Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { margin: 0; color: #666; font-size: 14px; }
    .card .val { font-size: 32px; font-weight: bold; margin-top: 10px; color: #1a73e8; }
    .card.alert .val { color: #d93025; }
    .table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; }
    th { background: #f8f9fa; color: #333; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-success { background: #e6f4ea; color: #137333; }
    .badge-failed { background: #fce8e6; color: #c5221f; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🚀 Log Management Dashboard</h2>
      <button onclick="fetchLogs()">🔄 Refresh Logs</button>
    </div>

    <div class="cards">
      <div class="card">
        <h3>TOTAL LOGS</h3>
        <div class="val" id="total-logs">0</div>
      </div>
      <div class="card alert">
        <h3>ALERTS (FAILED)</h3>
        <div class="val" id="total-alerts">0</div>
      </div>
      <div class="card">
        <h3>TENANTS</h3>
        <div class="val" id="total-tenants">0</div>
      </div>
    </div>

    <div class="table-container">
      <h3>Recent Log Events</h3>
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Tenant</th>
            <th>Vendor</th>
            <th>Action</th>
            <th>User</th>
            <th>IP</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="log-rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchLogs() {
      try {
        const res = await fetch('/api/logs');
        const logs = await res.json();
        
        document.getElementById('total-logs').innerText = logs.length;
        const alerts = logs.filter(l => l.status === 'FAILED').length;
        document.getElementById('total-alerts').innerText = alerts;
        const tenants = new Set(logs.map(l => l.tenant)).size;
        document.getElementById('total-tenants').innerText = tenants;

        const tbody = document.getElementById('log-rows');
        tbody.innerHTML = '';
        logs.forEach(l => {
          const badgeClass = l.status === 'FAILED' ? 'badge-failed' : 'badge-success';
          tbody.innerHTML += `<tr>
            <td>${l['@timestamp'] || '-'}</td>
            <td>${l.tenant || '-'}</td>
            <td>${l.vendor || '-'}</td>
            <td>${l.action || '-'}</td>
            <td>${l.user || '-'}</td>
            <td>${l.src_ip || '-'}</td>
            <td><span class="badge ${badgeClass}">${l.status || 'SUCCESS'}</span></td>
          </tr>`;
        });
      } catch (e) {
        console.error("Error fetching logs:", e);
      }
    }
    fetchLogs();
    setInterval(fetchLogs, 3000);
  </script>
</body>
</html>
